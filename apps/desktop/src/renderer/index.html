<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notesnook</title>
  </head>
  <body>
    <div id="app"></div>
    <!--
      Node-global polyfill — MUST run before /src/main.ts. The renderer
      orchestrates `@notesnook/core` directly (storage/crypto/fs are tRPC shims
      to the main process), and core's browser build plus the libsodium
      browser build reference `Buffer`, `global`, and `process` as bare globals
      at module-eval time. Electron 37's ESM renderer does not expose these
      even with nodeIntegration, so inject them here. Module scripts execute
      in document order, so this preceding module runs first.
    -->
    <script type="module">
      import { Buffer } from "buffer";
      window.Buffer ||= Buffer;
      window.global ||= window;
      window.process ||= {
        env: { NODE_ENV: "development" },
        platform: "darwin",
        arch: "arm64",
        versions: {},
        nextTick: (fn, ...args) => queueMicrotask(() => fn(...args))
      };
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
