name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Fast gate: typecheck + contract tests on Linux across the supported Node
  # range. Catches ABI regressions (better-sqlite3-multiple-ciphers compiles
  # from source per Node ABI) without spending macOS/Windows minutes.
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # vendor-dist/@notesnook/* are committed build artifacts, so the
        # vendor/notesnook source submodule is NOT needed for install/test/build.
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        # `npm ci` compiles the native SQLite module for the system Node ABI,
        # which is what the contract tests need (pretest:contract re-rebuilds
        # idempotently). No Electron-ABI rebuild here — that's only for `dev`.
        run: npm ci

      - name: Vendor drift guard
        # Verify the committed vendor-dist was built from the pinned submodule
        # commit. Needs no network and no submodule checkout (reads the
        # superproject gitlink), so it works under `submodules: false`.
        # Fails if someone moved the submodule without rebuilding vendor-dist.
        run: npm run vendor:check

      - name: Typecheck (node + web + contracts)
        run: npm run typecheck

      - name: Contract tests
        run: npm run test:contract

  # Cross-OS packaging: build the renderer/main/preload, then electron-builder
  # produces distributable installers per OS. electron-builder rebuilds the
  # native modules for the Electron ABI automatically. macOS is split across
  # arm64 (Apple Silicon) and x64 (Intel) hosts so each arch gets its native
  # FTS5 extension prebuilds — no cross-arch prebuild gap. Snap is deferred
  # (flaky in CI / confinement; see electron-builder.yml DEFERRED notes).
  package:
    name: Package ${{ matrix.os-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os-name: macos-arm64
            os: macos-latest
            targets: "--mac --arm64"
            # The platform-specific @tailwindcss/oxide native binding each host
            # needs for the Tailwind vite plugin during the renderer build.
            # See the "Install Tailwind oxide native binding" step below.
            oxide-pkg: "@tailwindcss/oxide-darwin-arm64"
          - os-name: macos-x64
            os: macos-13
            targets: "--mac --x64"
            oxide-pkg: "@tailwindcss/oxide-darwin-x64"
          - os-name: windows
            os: windows-latest
            targets: "--win"
            oxide-pkg: "@tailwindcss/oxide-win32-x64-msvc"
          - os-name: linux
            os: ubuntu-latest
            targets: "--linux AppImage"
            oxide-pkg: "@tailwindcss/oxide-linux-x64-gnu"

    env:
      # No code-signing certs in CI; disable auto-discovery so electron-builder
      # skips the identity lookup and produces unsigned artifacts without hanging.
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, matching the npm that generated the
          # committed (npm-11-style) lockfile. npm 11 is verified to fully
          # extract the large binary helper packages (app-builder-bin,
          # 7zip-bin, dmg-builder, dmg-license, iconv-corefoundation).
          # `cache: npm` is intentionally OFF here — see the next step.
          node-version: 24

      - name: Use latest npm
        # Pin to the latest npm 11 (matches the lockfile generator).
        run: npm install -g npm@latest

      - name: Install dependencies
        # No setup-node npm cache on this job (by design). The committed
        # lockfile is npm-11-style: the binary helper packages
        # (app-builder-bin, 7zip-bin, dmg-builder, dmg-license,
        # iconv-corefoundation) have entries WITHOUT `resolved`/`integrity`.
        # setup-node's `cache: npm` is keyed by the lockfile hash, so a bad
        # app-builder-bin tarball cached by an earlier run is restored on
        # every subsequent run and served by `npm ci` without rejection (there
        # is no lockfile integrity to verify against) — the package dir is
        # extracted but the multi-MB native binaries are not, so
        # electron-builder dies with "spawn app-builder ENOENT". This fails
        # identically under npm 10 and npm 11 because the cache is unchanged.
        # Skipping the cache forces a fresh, registry-integrity-verified
        # download, which extracts the binaries correctly. (Verified locally:
        # npm ci with a clean cache leaves app-builder-bin's 18-20MB binaries
        # present.) The extra ~1-2GB download per run is acceptable for a
        # packaging job and avoids the poisoned shared cache.
        run: npm ci

      - name: Install dependencies
        # `npm ci` for a locked, reproducible install. On npm 11 it fully
        # extracts the binary helper packages that npm 10 left incomplete
        # (see Setup Node note). It does NOT, however, fetch the
        # platform-specific @tailwindcss/oxide
        # native optional dep on non-darwin-arm64 hosts: the committed lockfile
        # only resolves that one platform variant (a known npm optional-deps
        # bug, npm/cli#4828). The next step installs the missing binding.
        run: npm ci

      - name: Install Tailwind oxide native binding (${{ matrix.os-name }})
        # Fetch the platform-correct @tailwindcss/oxide native binding at the
        # version matching the installed main oxide package, so the Tailwind
        # vite plugin can load it during the renderer build. Without this the
        # build fails with "Cannot find native binding" on every host except
        # macOS arm64 (whose binding is already in the committed lockfile).
        # `--no-save` keeps package.json/package-lock.json untouched (CI never
        # commits install drift anyway). Pinned to the main oxide version to
        # guarantee an ABI-matched binding.
        shell: bash
        run: |
          OXIDE_VER=$(node -p "require('./node_modules/@tailwindcss/oxide/package.json').version")
          echo "Installing ${{ matrix.oxide-pkg }}@${OXIDE_VER}"
          npm install --no-save --no-fund --no-audit "${{ matrix.oxide-pkg }}@${OXIDE_VER}"

      - name: Build (main + preload + renderer)
        run: npm run build

      - name: Package installer(s)
        working-directory: apps/desktop
        run: npx electron-builder --config electron-builder.yml ${{ matrix.targets }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: notesnook-vue-${{ matrix.os-name }}
          path: apps/desktop/release/*
          if-no-files-found: error
          retention-days: 14