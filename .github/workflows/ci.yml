name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cross-platform matrix catches OS-specific native-module builds
        # (better-sqlite3-multiple-ciphers compiles from source per OS/ABI)
        # and path-handling regressions.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # vendor-dist/@notesnook/* are committed build artifacts, so the
        # vendor/notesnook source submodule is NOT needed for install/test/build.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        # `npm ci` compiles the native SQLite module for the system Node ABI,
        # which is what the contract tests need (pretest:contract re-rebuilds
        # idempotently). No Electron-ABI rebuild here — that's only for `dev`.
        run: npm ci

      - name: Typecheck (node + web + contracts)
        run: npm run typecheck

      - name: Contract tests
        run: npm run test:contract

      - name: Build (main + preload + renderer)
        run: npm run build