name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Fast gate: typecheck + contract tests on Linux across the supported Node
  # range. Catches ABI regressions (better-sqlite3-multiple-ciphers compiles
  # from source per Node ABI) without spending macOS/Windows minutes.
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # vendor-dist/@notesnook/* are committed build artifacts, so the
        # vendor/notesnook source submodule is NOT needed for install/test/build.
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        # `npm ci` compiles the native SQLite module for the system Node ABI,
        # which is what the contract tests need (pretest:contract re-rebuilds
        # idempotently). No Electron-ABI rebuild here — that's only for `dev`.
        run: npm ci

      - name: Vendor drift guard
        # Verify the committed vendor-dist was built from the pinned submodule
        # commit. Needs no network and no submodule checkout (reads the
        # superproject gitlink), so it works under `submodules: false`.
        # Fails if someone moved the submodule without rebuilding vendor-dist.
        run: npm run vendor:check

      - name: Typecheck (node + web + contracts)
        run: npm run typecheck

      - name: Contract tests
        run: npm run test:contract

  # Cross-OS packaging: build the renderer/main/preload, then electron-builder
  # produces distributable installers per OS. macOS is arm64-only (Apple
  # Silicon) — x64/Intel builds are dropped (see electron-builder.yml `mac`).
  # Snap is deferred (flaky in CI / confinement; see electron-builder.yml
  # DEFERRED notes). Native modules ship at the host-Node ABI in CI
  # (`npmRebuild: false`); runtime native correctness is an on-site/release
  # gate, not a CI gate.
  package:
    name: Package ${{ matrix.os-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os-name: macos-arm64
            os: macos-latest
            # `--mac` only — the arm64 arch is pinned in electron-builder.yml
            # (`mac.target[].arch: [arm64]`). Don't pass `--arm64` here: when
            # the config target lists explicit arches, electron-builder IGNORES
            # the CLI arch flag and builds every arch in the config (it built
            # both arm64+x64 = 4 app copies ≈ 1.1 GB before the config was
            # narrowed to arm64-only).
            targets: "--mac"
            # The platform-specific @tailwindcss/oxide native binding each host
            # needs for the Tailwind vite plugin during the renderer build.
            # See the "Install Tailwind oxide native binding" step below.
            oxide-pkg: "@tailwindcss/oxide-darwin-arm64"
          - os-name: windows
            os: windows-latest
            targets: "--win"
            oxide-pkg: "@tailwindcss/oxide-win32-x64-msvc"
          - os-name: linux
            os: ubuntu-latest
            targets: "--linux AppImage"
            oxide-pkg: "@tailwindcss/oxide-linux-x64-gnu"

    env:
      # No code-signing certs in CI; disable auto-discovery so electron-builder
      # skips the identity lookup and produces unsigned artifacts without hanging.
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, matching the npm that generated the committed
          # (npm-11-style) lockfile. Verified on CI to fully extract the large
          # binary helper packages (app-builder-bin, 7zip-bin, dmg-builder, …).
          # `cache: npm` is intentionally OFF here — see the next step.
          node-version: 24

      - name: Use latest npm
        # Pin to the latest npm 11 (matches the lockfile generator).
        run: npm install -g npm@latest

      - name: Install dependencies
        # `cache: npm` is deliberately OFF on this job. Earlier runs WITH the
        # setup-node npm cache failed to extract app-builder-bin's native
        # binaries (the package dir landed in node_modules but the multi-MB
        # `app-builder` executable did not), and the cache is keyed only by the
        # lockfile hash so a bad entry persists across runs. Disabling it forces
        # a fresh registry download, which a debug run confirmed extracts the
        # binaries correctly. The primary packaging blocker is separate —
        # electron-builder's production-dep prune (see electron-builder.yml
        # `npmRebuild: false`) — but both fixes are needed: this step ensures
        # the helper is present, npmRebuild ensures electron-builder doesn't
        # then delete it. The extra ~1-2GB download per run is acceptable for a
        # packaging job. (The test job keeps its cache — it never packages.)
        run: npm ci

      - name: Install Tailwind oxide native binding (${{ matrix.os-name }})
        # Fetch the platform-correct @tailwindcss/oxide native binding at the
        # version matching the installed main oxide package, so the Tailwind
        # vite plugin can load it during the renderer build. Without this the
        # build fails with "Cannot find native binding" on every host except
        # macOS arm64 (whose binding is already in the committed lockfile).
        # `--no-save` keeps package.json/package-lock.json untouched (CI never
        # commits install drift anyway). Pinned to the main oxide version to
        # guarantee an ABI-matched binding.
        shell: bash
        run: |
          OXIDE_VER=$(node -p "require('./node_modules/@tailwindcss/oxide/package.json').version")
          echo "Installing ${{ matrix.oxide-pkg }}@${OXIDE_VER}"
          npm install --no-save --no-fund --no-audit "${{ matrix.oxide-pkg }}@${OXIDE_VER}"

      - name: Build (main + preload + renderer)
        run: npm run build

      - name: Rebuild native SQLite module for the Electron ABI
        # `npm ci` installs a prebuild of better-sqlite3-multiple-ciphers for the
        # *host Node* ABI, but the app runs in Electron (a different module ABI).
        # Without this rebuild the packaged app dies on startup with "Could not
        # locate the bindings file" (it looks for node-v136-…/better_sqlite3.node
        # which was never produced). The script pins the Electron version from the
        # installed `electron` package so the target ABI is deterministic
        # (@electron/rebuild's auto-detection falls back to the Node ABI when the
        # Electron binary isn't downloaded, silently shipping a broken .node).
        # `npmRebuild: false` (electron-builder.yml) means electron-builder won't
        # redo this — it packages our pre-rebuilt .node as-is. The FTS5 tokenizer
        # extensions are SQLite loadable libs, not Node addons, so they're skipped.
        run: npm run rebuild:electron

      - name: Disable Spotlight indexing (macOS DMG detach workaround)
        # GitHub-hosted macOS runners intermittently fail electron-builder's
        # DMG step at `hdiutil detach` with "resource busy": Spotlight (mds)
        # opens file handles on the freshly-mounted DMG volume, keeping it busy
        # so the detach never succeeds — electron-builder retries 5× then gives
        # up and the job fails (even though the .app/.zip/.dmg files were all
        # built fine; only the volume cleanup flaked). Disabling Spotlight
        # indexing on the root volume stops mds from grabbing the DMG. This is
        # the most-cited fix for that exact transient flake. No-op on Win/Linux.
        if: runner.os == 'macOS'
        run: sudo mdutil -i off /

      - name: Package installer(s)
        working-directory: apps/desktop
        shell: bash
        # macOS DMG creation can still flake transiently even with Spotlight off
        # (hdiutil detach races with other runner processes), so retry the whole
        # packaging pass a few times. `release/` is wiped before each attempt so
        # electron-builder starts clean; its Electron download is cached, so
        # retries are fast. Non-macOS hosts pass on attempt 1 almost always.
        run: |
          for i in 1 2 3; do
            echo "::group::Packaging attempt $i"
            rm -rf release
            if npx electron-builder --config electron-builder.yml ${{ matrix.targets }} --publish never; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            if [ "$i" -eq 3 ]; then
              echo "::error::Packaging failed after 3 attempts"
              exit 1
            fi
            echo "Attempt $i failed; retrying in 10s…"
            sleep 10
          done

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: notesnook-vue-${{ matrix.os-name }}
          path: apps/desktop/release/*
          if-no-files-found: error
          retention-days: 14